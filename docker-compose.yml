services:
  backend:
    build: .
    ports:
      - 3000:3000
    depends_on:
      - database
    restart: always
    command: npm start
    networks:
      - backend

  database:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - 27017:27017
    networks:
      - backend
    volumes:
      - ./data:/data/db

networks:
  backend:
    driver: bridge
